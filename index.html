<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outils Terres Lointaines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    html, body {
      height: 100%;
    }

    body {
      font-family: Montserrat, Arial, sans-serif;
      color: #1a1a1a;
      background: #ffffff;
      line-height: 1.6;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #004C7B 0%, #003A5A 100%);
      color: white;
      padding: 60px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: rgba(226, 194, 2, 0.1);
      border-radius: 50%;
      z-index: 0;
    }

    .header-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }

    .logo {
      height: 60px;
      margin-bottom: 30px;
      object-fit: contain;
    }

    header h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 18px;
      font-weight: 400;
      opacity: 0.95;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 32px;
      font-weight: 700;
      color: #004C7B;
      margin-bottom: 50px;
      text-align: center;
    }

    /* TOOLS GRID */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 32px;
    }

    /* TOOL CARD */
    .tool-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      text-decoration: none;
      color: inherit;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid #E1E6EB;
      box-shadow: 0 2px 12px rgba(0, 76, 123, 0.06);
      position: relative;
      overflow: hidden;
    }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: #E2C202;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s;
    }

    .tool-card:hover {
      border-color: #E2C202;
      box-shadow: 0 12px 32px rgba(0, 76, 123, 0.12);
      transform: translateY(-6px);
    }

    .tool-card:hover::before {
      transform: scaleY(1);
    }

    .tool-icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: inline-block;
    }

    .tool-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #004C7B;
      margin-bottom: 12px;
      transition: color 0.3s;
    }

    .tool-card:hover h2 {
      color: #E2C202;
    }

    .tool-card p {
      font-size: 15px;
      color: #6b6b6b;
      font-weight: 400;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .tool-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #E2C202;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    .tool-card:hover .tool-cta {
      gap: 12px;
    }

    /* FOOTER */
    footer {
      background: #F5FAFA;
      border-top: 1px solid #E1E6EB;
      padding: 40px;
      text-align: center;
      color: #6b6b6b;
      font-size: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      header {
        padding: 40px 20px;
      }

      header h1 {
        font-size: 28px;
      }

      header p {
        font-size: 16px;
      }

      .container {
        padding: 60px 20px;
      }

      .tools-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 24px;
      }

      .tool-card {
        padding: 30px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
<img src="TL_Principal_Horizontal_CMJN.jpg" alt="Terres Lointaines" class="logo">
    <h1>Outils Internes</h1>
    <p>Centralise tes cartes, dashboards et outils marketing</p>
  </div>
</header>

<div class="container">
  <h2 class="section-title">Accède à tes outils</h2>
  
  <div class="tools-grid">
    <a href="carte-tool.html" class="tool-card">
      <div class="tool-icon">🗺️</div>
      <h2>Générateur de cartes</h2>
      <p>Crée les itinéraires visuels pour tes circuits GIR. Design professionnel, export haute résolution.</p>
      <span class="tool-cta">Accéder →</span>
    </a>

    <!-- Ajoute d'autres outils ici -->
  </div>
</div>

<footer>
  <p>© 2026 Terres Lointaines • Outils marketing internes</p>
</footer>

</body>
</html>
