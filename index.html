<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outils Terres Lointaines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: Montserrat, Arial, sans-serif;
      background: linear-gradient(135deg, #F5FAFA 0%, #E1E6EB 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #1a1a1a;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    .logo {
      height: 80px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 32px;
      color: #004C7B;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #6b6b6b;
      font-weight: 500;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 50px;
    }

    .tool-card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      text-decoration: none;
      color: #1a1a1a;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0, 76, 123, 0.08);
    }

    .tool-card:hover {
      border-color: #E2C202;
      box-shadow: 0 8px 24px rgba(0, 76, 123, 0.15);
      transform: translateY(-4px);
    }

    .tool-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .tool-card h2 {
      font-size: 20px;
      color: #004C7B;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .tool-card p {
      font-size: 14px;
      color: #6b6b6b;
      font-weight: 500;
      line-height: 1.5;
    }

    .tool-card::after {
      content: "→";
      display: inline-block;
      margin-top: 16px;
      font-weight: 700;
      color: #E2C202;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .tool-card:hover::after {
      opacity: 1;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }
      .tools-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <img src="logo.jpg" alt="Terres Lointaines" class="logo">
    <h1>Outils Terres Lointaines</h1>
    <p class="subtitle">Centralise tes cartes, dashboards et outils marketing</p>
  </header>

  <div class="tools-grid">
    <a href="carte-tool.html" class="tool-card">
      <div class="tool-icon">🗺️</div>
      <h2>Générateur de cartes</h2>
      <p>Crée les itinéraires visuels pour tes circuits GIR. Design, exporte en haute résolution.</p>
    </a>

    <!-- Ajoute d'autres outils ici -->
  </div>
</div>

</body>
</html>
